<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todo-List</title>
</head>
<body>
    <div class="container">
        <div class="Top">
            <h2>Todo-List</h2>
            <div class="mid-row">
                <input type="text" placeholder="Enter Task..." class="Input-Box">
                <button class="Btn">Add</button>
            </div>
            <ul class="List">
            </ul>
            <div class="controls">
                <button class="clear-btn" style="margin-left: auto;">Clear All</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
